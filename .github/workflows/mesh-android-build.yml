name: Meridian Android build
on:
  pull_request:
    branches: [main, ui]
  push:
    branches: [ui, feature/rescuemesh-android-bridge]
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_API_BASE_URL: https://safehaven-production-3da2.up.railway.app
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate and configure native project
        run: npm run android:init
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meridian-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
