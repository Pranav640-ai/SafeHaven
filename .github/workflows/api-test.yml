name: Backend tests
on:
  push:
    branches: [ui]
  pull_request:
    branches: [ui, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock.txt
      - run: python -m pytest backend/test_app.py -q
      - name: Verify deployment container builds
        run: docker build -t safehaven-validation .
