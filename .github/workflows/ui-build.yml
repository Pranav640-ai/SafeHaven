name: UI build
on:
  push:
    branches: [ui]
  pull_request:
    branches: [main, ui]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock.txt
      - run: npx playwright install --with-deps chromium
      - name: Browser and offline checks
        run: |
          SAFETY_ADMIN_TOKEN=ci-test-token-not-a-secret-000000000000 python -m uvicorn backend.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break || sleep 1; done
          npm run test:web
